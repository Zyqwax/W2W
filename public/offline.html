<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111113">
    <title>Çevrimdışısın · W2W</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111113; color: #f5f5f5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: 1.6rem; }
      p { color: #aaa; line-height: 1.6; }
      button { min-height: 2.75rem; margin-top: 1rem; padding: 0 1.25rem; border: 0; border-radius: .75rem; background: #e8bd67; color: #111; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Şu an çevrimdışısın</h1>
      <p>Bağlantın geldiğinde tekrar dene. Daha önce açtığın film görselleri ve bazı film bilgileri kullanılabilir durumda olabilir.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
